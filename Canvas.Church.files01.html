<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Library</title>
    <style>
        /* Real-time Search Input Wrapper Layout */
        .search-wrapper {
            margin-bottom: 24px;
            position: relative;
        }
        .search-input {
            width: 100%;
            box-sizing: border-box;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 14px 16px 14px 44px; /* Space on left for magnifier icon */
            font-size: 15px;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }
        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }
        /* Magnifying Glass Icon Anchor Graphic */
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            width: 16px;
            height: 16px;
        }
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #38bdf8;
            --border-color: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;

            /* --- Background Image Properties --- */
            background-image: url('your-image.jpg'); /* Replace with your actual image path */
            background-attachment: fixed;           /* Keeps the image still while scrolling */
            background-position: center;            /* Centers the image on the screen */
            background-repeat: no-repeat;           /* Prevents the image from tiling */
            background-size: cover;                 /* Ensures the image fills the entire screen */
        }
        .container { width: 100%; max-width: 650px; }
        header { text-align: center; margin-bottom: 32px; }
        h1 { font-size: 28px; margin-bottom: 16px; } /* Fixed broken bracket from prompt cutoff */
    </style>
</head>
<body>
    <!-- Your HTML content goes here -->
</body>
</html>
